<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Prime Pizza POS</title>
    <style>
        :root {
            --primary: #c41535;
            --secondary: #f4d038;
            --dark: #222222;
            --light: #f9f9f9;
            --gray: #e0e0e0;
            --text: #333333;
            --white: #ffffff;
            --border: #cccccc;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--gray);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--dark);
            color: var(--white);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--primary);
        }

        header .logo h1 {
            color: var(--primary);
            font-size: 24px;
            font-weight: bold;
        }

        header .logo p {
            font-size: 10px;
            color: var(--secondary);
        }

        header .contacts {
            font-size: 10px;
            text-align: left;
        }

        main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #menu-section {
            flex: 2;
            display: flex;
            flex-direction: column;
            background-color: var(--light);
            border-left: 2px solid var(--gray);
        }

        .categories {
            display: flex;
            background-color: var(--white);
            overflow-x: auto;
            border-bottom: 1px solid var(--gray);
            padding: 5px;
        }

        .cat-btn {
            background: none;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            color: var(--text);
            cursor: pointer;
            white-space: nowrap;
            border-radius: 5px;
            margin: 0 2px;
        }

        .cat-btn.active, .cat-btn:hover {
            background-color: var(--primary);
            color: var(--white);
        }

        .menu-items {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            align-content: start;
        }

        .item-card {
            background-color: var(--white);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.1s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid var(--border);
        }

        .item-card:active {
            transform: scale(0.95);
        }

        .item-name {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .item-price {
            font-size: 14px;
            color: var(--primary);
            font-weight: bold;
        }

        #cart-section {
            flex: 1;
            background-color: var(--white);
            display: flex;
            flex-direction: column;
            min-width: 350px;
            box-shadow: -2px 0 5px rgba(0, 0, 0, 0.1);
        }

        .order-type-selector {
            display: flex;
            padding: 15px;
            gap: 10px;
            background-color: var(--light);
        }

        .type-btn {
            flex: 1;
            background-color: var(--white);
            border: 1px solid var(--border);
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s;
        }

        .type-btn.active {
            background-color: var(--dark);
            color: var(--white);
            border-color: var(--dark);
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            border-top: 1px solid var(--gray);
            border-bottom: 1px solid var(--gray);
            padding: 10px 0;
        }

        .cart-item {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid var(--gray);
            font-size: 14px;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: bold;
            font-size: 14px;
        }

        .cart-item-details {
            color: #666;
            margin-top: 5px;
            font-size: 12px;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .qty-btn {
            background-color: var(--secondary);
            border: none;
            width: 30px;
            height: 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-btn:active {
            transform: scale(0.9);
        }

        .del-btn {
            background-color: var(--primary);
            color: var(--white);
            border: none;
            width: 30px;
            height: 30px;
            font-size: 14px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 10px;
        }

        .cart-totals {
            padding: 15px;
            background-color: var(--light);
            font-size: 14px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .total-row input {
            padding: 5px;
            width: 80px;
            text-align: center;
            border: 1px solid var(--border);
            border-radius: 4px;
        }

        .total-row.grand-total {
            font-size: 18px;
            font-weight: bold;
            color: var(--primary);
            border-top: 1px solid var(--border);
            padding-top: 10px;
            margin-top: 10px;
        }

        .cart-actions {
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .action-btn {
            background-color: var(--dark);
            color: var(--white);
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .action-btn:hover {
            background-color: #444;
        }

        .action-btn.pay-btn {
            background-color: var(--primary);
        }

        .action-btn.pay-btn:hover {
            background-color: #a0102b;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: var(--white);
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            color: var(--primary);
        }

        .size-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .size-btn {
            background-color: var(--light);
            border: 2px solid var(--border);
            padding: 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .size-btn.active, .size-btn:hover {
            border-color: var(--primary);
            background-color: #fff0f2;
            color: var(--primary);
        }

        .payment-inputs {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .payment-inputs label {
            font-weight: bold;
            font-size: 14px;
        }

        .payment-inputs input {
            padding: 12px;
            font-size: 16px;
            border: 1px solid var(--border);
            border-radius: 5px;
            width: 100%;
        }

        .modal-submit {
            background-color: var(--primary);
            color: var(--white);
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }

        .modal-cancel {
            background-color: var(--gray);
            color: var(--text);
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--gray);
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <h1>The Prime Pizza</h1>
            <p>NEAR KHAN HOTEL KIRI AFGHANA, JHELUM</p>
        </div>
        <div class="contacts">
            <p>0328-2077474</p>
            <p>0311-5761810</p>
            <p>0321-6772803</p>
        </div>
    </header>

    <main>
        <section id="menu-section">
            <div class="categories" id="categories">
                <button class="cat-btn active" onclick="filterCategory('all')">تمام</button>
                <button class="cat-btn" onclick="filterCategory('Regular Pizza')">ریگولر پیزا</button>
                <button class="cat-btn" onclick="filterCategory('Special Pizza')">اسپیشل پیزا</button>
                <button class="cat-btn" onclick="filterCategory('Burgers')">برگر</button>
                <button class="cat-btn" onclick="filterCategory('Rolls & Shawarma')">رولز اور شاورمہ</button>
                <button class="cat-btn" onclick="filterCategory('Sides & Pasta')">سائیڈز اور پاستا</button>
                <button class="cat-btn" onclick="filterCategory('Deals')">ڈیلز</button>
            </div>
            <div class="menu-items" id="menu-items">
                <!-- Items will be loaded by JS -->
            </div>
        </section>

        <section id="cart-section">
            <div class="order-type-selector">
                <button class="type-btn active" onclick="setOrderType('Dine-In')">ڈائن اِن</button>
                <button class="type-btn" onclick="setOrderType('Takeaway')">ٹیک اوے</button>
                <button class="type-btn" onclick="setOrderType('Delivery')">ڈیلیوری</button>
            </div>
            <div class="cart-items" id="cart-items">
                <!-- Cart items will be loaded by JS -->
            </div>
            <div class="cart-totals">
                <div class="total-row">
                    <span>سب ٹوٹل:</span>
                    <span id="subtotal">0</span>
                </div>
                <div class="total-row">
                    <span>ڈسکاؤنٹ:</span>
                    <input type="number" id="discount-input" value="0" onchange="updateCartTotals()">
                </div>
                <div class="total-row">
                    <span>ڈیلیوری چارجز:</span>
                    <input type="number" id="delivery-input" value="0" onchange="updateCartTotals()">
                </div>
                <div class="total-row grand-total">
                    <span>کل بل:</span>
                    <span id="grand-total">0</span>
                </div>
            </div>
            <div class="cart-actions">
                <button class="action-btn" onclick="clearCart()">آرڈر کینسل</button>
                <button class="action-btn pay-btn" onclick="openPaymentModal()">بل بنائیں</button>
            </div>
        </section>
    </main>

    <!-- Size Selection Modal -->
    <div id="size-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">سائز منتخب کریں</div>
            <div class="size-options" id="size-options">
                <!-- Sizes will be loaded by JS -->
            </div>
            <button class="modal-cancel" onclick="closeModal('size-modal')">کینسل</button>
        </div>
    </div>

    <!-- Payment Modal -->
    <div id="payment-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">ادائیگی کی تفصیلات</div>
            <div class="payment-inputs">
                <label>کل بل:</label>
                <input type="text" id="pay-total" readonly>
                <label>کیش وصول کیا:</label>
                <input type="number" id="pay-cash" placeholder="کیش درج کریں" oninput="calculateChange()">
                <label>باقی (Change):</label>
                <input type="text" id="pay-change" readonly>
            </div>
            <button class="modal-submit" onclick="processPayment()">پرنٹ رسید</button>
            <button class="modal-cancel" onclick="closeModal('payment-modal')">کینسل</button>
        </div>
    </div>

            { id: 64, name: 'Deal 8', category: 'Deals', prices: { 'Regular': 1800 } },
            { id: 65, name: 'Deal 9', category: 'Deals', prices: { 'Regular': 2000 } },
            { id: 66, name: 'Deal 10', category: 'Deals', prices: { 'Regular': 1800 } },
        ];

        let cart = [];
        let currentOrderType = 'Dine-In';
        let selectedItemForSize = null;

        function loadMenu(category = 'all') {
            const menuContainer = document.getElementById('menu-items');
            menuContainer.innerHTML = '';

            const filteredItems = category === 'all' 
                ? menuDatabase 
                : menuDatabase.filter(item => item.category === category);

            filteredItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.onclick = () => handleItemClick(item);

                const priceDisplay = Object.keys(item.prices).length > 1 
                    ? 'سائز چنیں...' 
                    : `${Object.values(item.prices)[0]} روپے`;

                card.innerHTML = `
                    <div class="item-name">${item.name}</div>
                    <div class="item-price">${priceDisplay}</div>
                `;
                menuContainer.appendChild(card);
            });
        }

        function filterCategory(category) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            loadMenu(category);
        }

        function handleItemClick(item) {
            const sizes = Object.keys(item.prices);
            if (sizes.length > 1) {
                selectedItemForSize = item;
                const sizeOptionsContainer = document.getElementById('size-options');
                sizeOptionsContainer.innerHTML = '';

                sizes.forEach(size => {
                    const price = item.prices[size];
                    const btn = document.createElement('button');
                    btn.className = 'size-btn';
                    btn.onclick = () => selectSizeAndAdd(size, price);
                    
                    const sizeLabel = size === 'Small' ? 'چھوٹا (Small)' : size === 'Medium' ? 'میڈیم (Medium)' : size === 'Large' ? 'بڑا (Large)' : size === 'XL' ? 'ایکسٹرا بڑا (XL)' : size;
                    btn.innerHTML = `${sizeLabel}<br>${price} روپے`;
                    sizeOptionsContainer.appendChild(btn);
                });

                document.getElementById('size-modal').style.display = 'flex';
            } else {
                addToCart(item.name, Object.keys(item.prices)[0], Object.values(item.prices)[0]);
            }
        }

        function selectSizeAndAdd(size, price) {
            closeModal('size-modal');
            addToCart(selectedItemForSize.name, size, price);
        }

        function addToCart(name, size, price) {
            const existingItemIndex = cart.findIndex(item => item.name === name && item.size === size);

            if (existingItemIndex > -1) {
                cart[existingItemIndex].qty += 1;
            } else {
                cart.push({ name, size, price, qty: 1 });
            }
            renderCart();
            updateCartTotals();
        }

        function renderCart() {
            const cartContainer = document.getElementById('cart-items');
            cartContainer.innerHTML = '';

            cart.forEach((item, index) => {
                const cartItem = document.createElement('div');
                cartItem.className = 'cart-item';
                cartItem.innerHTML = `
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.name} (${item.size})</div>
                        <div class="cart-item-details">${item.qty} x ${item.price} = ${item.qty * item.price} روپے</div>
                    </div>
                    <div class="cart-item-controls">
                        <button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>
                        <span>${item.qty}</span>
                        <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
                        <button class="del-btn" onclick="removeItem(${index})">X</button>
                    </div>
                `;
                cartContainer.appendChild(cartItem);
            });
        }

        function updateQty(index, change) {
            cart[index].qty += change;
            if (cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            renderCart();
            updateCartTotals();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            renderCart();
            updateCartTotals();
        }

        function setOrderType(type) {
            currentOrderType = type;
            document.querySelectorAll('.type-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            updateCartTotals();
        }

        function updateCartTotals() {
            const subtotal = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            const discount = parseFloat(document.getElementById('discount-input').value) || 0;
            const delivery = parseFloat(document.getElementById('delivery-input').value) || 0;
            const grandTotal = subtotal - discount + delivery;

            document.getElementById('subtotal').innerText = subtotal;
            document.getElementById('grand-total').innerText = grandTotal;
        }

        function clearCart() {
            if (confirm('کیا آپ واقعی آرڈر کینسل کرنا چاہتے ہیں؟')) {
                cart = [];
                document.getElementById('discount-input').value = 0;
                document.getElementById('delivery-input').value = 0;
                renderCart();
                updateCartTotals();
            }
        }

        function openPaymentModal() {
            if (cart.length === 0) {
                alert('کارٹ خالی ہے!');
                return;
            }
            const grandTotal = document.getElementById('grand-total').innerText;
            document.getElementById('pay-total').value = grandTotal;
            document.getElementById('pay-cash').value = '';
            document.getElementById('pay-change').value = '';
            document.getElementById('payment-modal').style.display = 'flex';
        }

        function calculateChange() {
            const total = parseFloat(document.getElementById('pay-total').value);
            const cash = parseFloat(document.getElementById('pay-cash').value) || 0;
            const change = cash - total;
            document.getElementById('pay-change').value = change >= 0 ? change : 0;
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function processPayment() {
            const cash = parseFloat(document.getElementById('pay-cash').value) || 0;
            const total = parseFloat(document.getElementById('pay-total').value);

            if (cash < total) {
                alert('وصول کردہ کیش کل بل سے کم ہے!');
                return;
            }

            window.print();
            
            closeModal('payment-modal');
            cart = [];
            document.getElementById('discount-input').value = 0;
            document.getElementById('delivery-input').value = 0;
            renderCart();
            updateCartTotals();
        }

        loadMenu();
    </script>
</body>
</html>
